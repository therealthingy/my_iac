---
- name: Apply 4 current user + Configure Default User Profile template 4 global enforcement
  block:
    - name: Local user
      ansible.windows.win_regedit:
        path: "HKCU:\\{{ hkcu_key.path_wo_hkcu }}"
        name: "{{ hkcu_key.name }}"
        data: "{{ hkcu_key.data | default('') }}"
        type: "{{ hkcu_key.type | default('string') }}"
        state: "{{ hkcu_key.state | default('present') }}"
      loop: "{{ reg_hkcu_keys }}"
      loop_control:
        loop_var: hkcu_key

    - name: Configure Default User Profile template 4 global enforcement
      block:
        - name: Mount Default User Registry Hive
          ansible.windows.win_powershell:
            script: |
              reg load HKLM\DefUser C:\Users\Default\NTUSER.DAT
          changed_when: false
        - name: Apply setting
          ansible.windows.win_regedit:
            path: "HKLM:\\DefUser\\{{ hkcu_key.path_wo_hkcu }}"
            name: "{{ hkcu_key.name }}"
            data: "{{ hkcu_key.data | default('') }}"
            type: "{{ hkcu_key.type | default('string') }}"
            state: "{{ hkcu_key.state | default('present') }}"
          loop: "{{ reg_hkcu_keys }}"
          loop_control:
            loop_var: hkcu_key
      always:
        - name: Unmount Default User Registry Hive
          ansible.windows.win_powershell:
            script: |
              [gc]::Collect()
              [gc]::WaitForPendingFinalizers()
              reg unload HKLM\DefUser
          changed_when: false

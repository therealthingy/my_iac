---
- name: Windows Lock Screen
  block:
  - name: Windows Lock Screen - Disable
    ansible.windows.win_regedit:
      path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization
      name: NoLockScreen
      data: 1
      type: dword
      state: present
  - name: Windows Lock Screen - Disable Slideshows
    ansible.windows.win_regedit:
      path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization
      name: NoLockScreenSlideshow
      data: 1
      type: dword
      state: present

- name: Lock Screen - Turn off lock screen background on the sign-in screen (configure solid color)
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\System
    name: DisableLogonBackgroundImage
    data: 1
    type: dword
    state: present

- name: TaskBar - Start menu alignment
  block:
    - name: Local user
      ansible.windows.win_regedit:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        name: TaskbarAl
        data: 0  # 0 = Left-aligned, 1 = Center-aligned
        type: dword
        state: present
    - name: Configure Default User Profile template 4 global enforcement
      block:
        - name: Mount Default User Registry Hive
          ansible.windows.win_powershell:
            script: |
              reg load HKLM\DefUser C:\Users\Default\NTUSER.DAT
          changed_when: false
        - name: Apply setting
          ansible.windows.win_regedit:
            path: HKLM:\DefUser\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
            name: TaskbarAl
            data: 0
            type: dword
            state: present
      always:
        - name: Unmount Default User Registry Hive
          ansible.windows.win_powershell:
            script: |
              [gc]::Collect()
              [gc]::WaitForPendingFinalizers()
              reg unload HKLM\DefUser
          changed_when: false


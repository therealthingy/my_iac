#- brave # TODO: System wide

- name: Install packages
  include_tasks: choco.yml
  with_items: "{{ choco_packages }}"
  loop_control:
    loop_var: choco_package

- name: "[Non-VM] Install packages"
  include_tasks: choco.yml
  vars:
    package: choco_package
  with_items: "{{ choco_packages }}"
  loop_control:
    loop_var: choco_package
  when: ansible_facts['virtualization_role'] != 'guest'

- name: Clean chocolatey & nuget cache
  block:
    - name: Clean up the chocolatey & NuGet cache
      ansible.windows.win_file:
        path: "{{ item }}"
        state: absent
      loop:
        - '%UserProfile%\AppData\Local\Temp\chocolatey\'
        - '%UserProfile%\AppData\Local\Temp\nuget\'
        - '%UserProfile%\AppData\Local\NuGet\Cache\'
      register: cleanup_task
  rescue:
    - name: "{{ cleanup_task.msg }}"
      ansible.builtin.debug:
        msg: >
          "Some chocolatey cache files are still in use. You may need to reboot your machine to resolve the error"

# TODO: File extensions

# TAKEN FROM: https://github.com/stkrzysiak/windows-playbook-scoop/blob/master/tasks/desktop.yml
- name: Get user profile path
  ansible.windows.win_command: powershell.exe -
  args:
    stdin: echo $HOME
  changed_when: False
  register: user_home_path

- name: Get shortcuts
  ansible.windows.win_find:
    paths:
      - C:\Users\Public\Desktop
      - '{{ user_home_path.stdout | trim }}\Desktop'
      - '{{ user_home_path.stdout | trim }}\OneDrive\Desktop'
    patterns: "*.lnk"
  register: shortcuts

- name: Remove shortcuts from the Desktop
  ansible.windows.win_file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ shortcuts.files | unique }}"
  when: shortcuts.files | length > 0

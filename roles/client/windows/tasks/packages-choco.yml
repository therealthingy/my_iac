- name: Install Devel packages
  win_chocolatey:
    name:
      - git.install
      - python3
      - winmerge
      - hxd
    state: present

- name: Install inet packages
  win_chocolatey:
    name:
      - thunderbird
    state: present
  when: ansible_facts['virtualization_role'] != 'guest'

#- brave # TODO: System wide

- name: Install Office packages
  win_chocolatey:
    name:
      - imageglass
      - sumatrapdf.install
      - caesium.install
      - pdftkbuilder
      - vlc.install
    state: present

- name: Install Office Packages II
  win_chocolatey:
    name:
      - InkScape
      - file-converter
      - drawio
      - obs-studio.install
      - libreoffice-fresh
      - digikam
    state: present
  when: ansible_facts['virtualization_role'] != 'guest'

- name: Install PowerUser packages
  win_chocolatey:
    name:
      - 7zip.install
      - bleachbit.install
      - hashtab
      - vscodium.install
      - notepadplusplus.install
      - WinDirStat
      - powertoys
    state: present

- name: Create Sysinternals shortcuts
  block:
    - win_chocolatey:
        name:
          - sysinternals
        state: present
    - ansible.windows.win_file:
        path: 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Sysinternals'
        state: directory
    - community.windows.win_shortcut:
        src: "C:\\ProgramData\\chocolatey\\lib\\sysinternals\\tools\\{{ item }}.exe"
        dest: "C:\\ProgramData\\Microsoft\\Windows\\Start Menu\\Programs\\Sysinternals\\{{ item }}.lnk"
        directory: "C:\\ProgramData\\chocolatey\\bin"
        icon: "C:\\ProgramData\\chocolatey\\bin\\{{ item }}.exe,0"
      with_items:
        - AccessEnum
        - ADExplorer64
        - ADInsight64
        - Autoruns64
        - Bginfo64
        - Cacheset64
        - CoreinfoEx64
        - CPUSTRES64
        - dbgview64
        - Desktops64
        - disk2vhd64
        - Diskmon64
        - DiskView64
        - LoadOrd64
        - procexp64
        - Procmon64
        - RAMMap64
        - RDCMan
        - ShellRunas
        - tcpview64
        - vmmap64
        - Winobj64
        - ZoomIt64

- name: Install Maintenance packages
  win_chocolatey:
    name:
      - bulk-crap-uninstaller   # TODO: Doesn't work
      - shutup10
    state: present
  #become: true
  #become_user: Administrator
  #become_method: runas

- name: Install HW Monitoring Tools
  win_chocolatey:
    name:
      - crystaldiskinfo # crystaldiskinfo.portable
      - crystaldiskmark
      - coretemp
      - cpu-z.install
      - gpu-z
    state: present
  when: ansible_facts['virtualization_role'] != 'guest'

- name: Install Services/Misc. packages
  win_chocolatey:
    name:
      - wireguard
      - greenshot
      - rustdesk.install
      - keepassx
      - kindle
      #- lghub
    state: present
  when: ansible_facts['virtualization_role'] != 'guest'

---
# SEE ALSO: https://github.com/stkrzysiak/windows-playbook-scoop/blob/master/tasks/chocolatey.yml

# Prereqs.
- name: Ensure Chocolatey is installed
  win_chocolatey:
    # NOTE: `chocolatey` is implicitly installed …
    name: chocolateygui
    state: present

- name: Win32-OpenSSH service - install
  block:
    - win_chocolatey:
        name: openssh
        package_params: /SSHServerFeature
        state: present
    # Set the default shell 2 PowerShell
    - win_regedit:
        path: HKLM:\SOFTWARE\OpenSSH
        name: DefaultShell
        data: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        type: string
        state: present

#- brave # TODO: System wide

- name: Install packages
  win_chocolatey:
    name: "{{ item.name | default(item) }}"
    state: "{{ item.state | default('present') }}"
    version: "{{ item.version | default(omit) }}"
    choco_args: "{{ item.choco_args | default(omit) }}"
  with_items: choco_packages

- name: Install Sysinternals
  block:
    - win_chocolatey:
        name:
          - sysinternals
        state: present
    - ansible.windows.win_file:
        path: 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Sysinternals'
        state: directory
    - community.windows.win_shortcut:
        src: "C:\\ProgramData\\chocolatey\\lib\\sysinternals\\tools\\{{ item }}.exe"
        dest: "C:\\ProgramData\\Microsoft\\Windows\\Start Menu\\Programs\\Sysinternals\\{{ item }}.lnk"
        directory: "C:\\ProgramData\\chocolatey\\bin"
        icon: "C:\\ProgramData\\chocolatey\\bin\\{{ item }}.exe,0"
      with_items:
        - AccessEnum
        - ADExplorer64
        - ADInsight64
        - Autoruns64
        - Bginfo64
        - Cacheset64
        - CoreinfoEx64
        - CPUSTRES64
        - dbgview64
        - Desktops64
        - disk2vhd64
        - Diskmon64
        - DiskView64
        - LoadOrd64
        - procexp64
        - Procmon64
        - RAMMap64
        - RDCMan
        - ShellRunas
        - tcpview64
        - vmmap64
        - Winobj64
        - ZoomIt64

- name: "[Non-VM] Install packages"
  win_chocolatey:
    name: "{{ item.name | default(item) }}"
    state: "{{ item.state | default('present') }}"
    version: "{{ item.version | default(omit) }}"
    choco_args: "{{ item.choco_args | default(omit) }}"
  with_items: choco_packages_no_vm
  when: ansible_facts['virtualization_role'] != 'guest'

- name: Clean chocolatey & nuget cache
  block:
    - name: Clean up the chocolatey and NuGet cache.
      ansible.windows.win_file:
        path: "{{ item }}"
        state: absent
      loop:
        - '%UserProfile%\AppData\Local\Temp\chocolatey\'
        - '%UserProfile%\AppData\Local\Temp\nuget\'
        - '%UserProfile%\AppData\Local\NuGet\Cache\'
      register: cleanup_task
  rescue:
    - name: "{{ cleanup_task.msg }}"
      ansible.builtin.debug:
        msg: >
          "Some chocolatey cache files are still in use. You may need to reboot your machine to resolve the error"

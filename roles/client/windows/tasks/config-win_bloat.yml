---
- name: OOSU10 machine-wide
  ansible.windows.win_regedit:
    path: "HKLM:\\{{ hklm_key.path_wo_hklm }}"
    name: "{{ hklm_key.name }}"
    data: "{{ hklm_key.data | default('') }}"
    type: "{{ hklm_key.type | default('dword') }}"
    state: "{{ hklm_key.state | default('present') }}"
  loop_control:
    loop_var: hklm_key
  with_items:
    # -- Privacy --
    # Disable sharing of handwriting data
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Windows\TabletPC
      name: PreventHandwritingDataSharing
      data: 1
    # Disable sharing of handwriting error reports
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Windows\HandwritingErrorReports
      name: PreventHandwritingErrorReports
      data: 1
    # Disable Inventory Collector
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Windows\AppCompat
      name: DisableInventory
      data: 1
    # Disable camera in logon screen
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Windows\Personalization
      name: NoLockScreenCamera
      data: 1
      type: dword
    # Disable and reset Advertising and info     TODO: Doesn't work ?!
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Windows\AdvertisingInfo
      name: DisabledByGroupPolicy
      data: 1
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Windows\AdvertisingInfo
      name: Enabled
      data: 0
    # Disable Windows Error Reporting
    - path_wo_hklm: SOFTWARE\Microsoft\Windows\Windows Error Reporting
      name: Disabled
      data: 1
    # Disable cloud consumer account state content
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Windows\CloudContent
      name: DisableConsumerAccountStateContent
      data: 1
    # Disable display of office.com files in Explorer
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Windows\Explorer
      name: DisableGraphRecentItems
      data: 1
      type: dword
      state: present
    # -- Activity History and Clipboard --
    # Disable recordings of user activity
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Windows\System
      name: EnableActivityFeed
      data: 0
    # Disable storing users' activity history
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Windows\System
      name: PublishUserActivities
      data: 0
    # Disable the submission of user activities to MS
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Windows\System
      name: UploadUserActivities
      data: 0
    # Disable storage of clipboard history:
    #   OMITTED: HKLM\SOFTWARE\Policies\Microsoft\Windows\System\AllowClipboardHistory
    # Disable the transfer of the clipboard to other devices via the cloud
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Windows\System
      name: AllowCrossDeviceClipboard
      data: 0
    # -- App Privacy --
    #   OMITTED
    # -- Security --
    # Disable telemetry
    - path_wo_hklm: System\CurrentControlSet\Services\DiagTrack
      name: Start
      data: 4
    - path_wo_hklm: System\CurrentControlSet\Services\dmwappushservice
      name: Start
      data: 4
    - path_wo_hklm: System\CurrentControlSet\Control\WMI\Autologger\AutoLogger-Diagtrack-Listener
      name: Start
      data: 4
    # -- MS Edge --
    #   NOTE: Verify via `edge://policy`
    #   REFERENCE: https://learn.microsoft.com/en-gb/DeployEdge/microsoft-edge-policies#available-policies
    # Disable personalizing advertising, search, news and other services
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: PersonalizationReportingEnabled
      data: 0
    # Disable user feedback in toolbar
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: UserFeedbackAllowed
      data: 0
    # Disable shopping assistant
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: EdgeShoppingAssistantEnabled
      data: 0
    # Hide Microsoft 365 Copilot chat icon
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: Microsoft365CopilotChatIconEnabled
      data: 0
    # Disable Edge bar
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: WebWidgetAllowed
      data: 0
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: SearchbarAllowed
      data: 0
    # Disable Sidebar
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: HubsSidebarEnabled
      data: 0
    # Disable Enhanced Spell Checking
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: MicrosoftEditorProofingEnabled
      data: 0
    # Hide first run experience and splash screen
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: HideFirstRunExperience
      data: 1
    # Disable spotlight experiences and recommendations
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: SpotlightExperiencesAndRecommendationsEnabled
      data: 0
    # Disable automatic sign-in from web to browser
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: WebToBrowserSignInEnabled
      data: 0
    # Disable Bing Chat on new tab page
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: NewTabPageBingChatEnabled
      data: 0
    # Disable content on new tab page
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: NewTabPageContentEnabled
      data: 0
    # Disable AI-generated themes
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: AIGenThemesEnabled
      data: 0
    # Disable inline Compose feature
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: ComposeInlineEnabled
      data: 0
    # Disable Copilot access to page content
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: CopilotPageContext
      data: 0
    # Disable prompts to make Edge the default browser
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: DefaultBrowserSettingEnabled
      data: 0
    # Disable default browser campaigns
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: DefaultBrowserSettingsCampaignEnabled
      data: 0
    # Disable diagnostic data collection
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: DiagnosticData
      data: 0
    # Disable shopping assistant
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: EdgeShoppingAssistantEnabled
      data: 0
    # Hide Microsoft 365 Copilot chat icon: TODO
    # Hide Microsoft Rewards
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: ShowMicrosoftRewards
      data: 0
    # Disable recommendations in settings
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: ShowRecommendationsEnabled
      data: 0
    # Disable cloud-based tab services
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: TabServicesEnabled
      data: 0
    # Disable text prediction in forms
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: TextPredictionEnabled
      data: 0
    # Disable AI-powered history search    TODO: Is this on-device ?!
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: EdgeHistoryAISearchEnabled
      data: 0
    # Disable Edge Secure Network (built-in VPN)
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: EdgeSecureNetworkEnabled
      data: 0
    # Disable use of web service to resolve navigation errors
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: ResolveNavigationErrorsUseWebService
      data: 0
    # Disable suggestion of similar sites when website cannot be found
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: AlternateErrorPagesEnabled
      data: 0
    # Hide default top sites on new tab page
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: NewTabPageHideDefaultTopSites
      data: 1
    # Hide Adobe Acrobat subscription button
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: ShowAcrobatSubscriptionButton
      data: 0
    # Disable the Microsoft Account Sign-In Button
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: BrowserSignin
      data: 0
    # -- Copilot & Windows AI --
    # Disable the Windows Copilot
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Windows\WindowsCopilot
      name: TurnOffWindowsCopilot
      data: 1
    # Disable the provision of Recall functionality to all users
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Windows\WindowsAI
      name: AllowRecallEnablement
      data: 0
    # Disable the Image Creator in Microsoft Paint
    - path_wo_hklm: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Paint
      name: DisableImageCreator
      data: 1
    # Disable Windows Copilot+ Recall
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Windows\WindowsAI
      name: DisableAIDataAnalysis
      data: 1
    # Disable AI features in Notepad
    - path_wo_hklm: SOFTWARE\Policies\WindowsNotepad
      name: DisableAIFeatures
      data: 1
    # Disable AI action in File Explorer
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Windows\Explorer
      name: HideAIActionsMenu
      data: 1
    # -- User Behavior --
    # Disable application telemetry
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Windows\DataCollection
      name: AllowTelemetry
      data: 0
    # Disable diagnostic data from customizing user experiences
    - path_wo_hklm: SOFTWARE\Microsoft\Windows\CurrentVersion\Privacy
      name: TailoredExperiencesWithDiagnosticDataEnabled
      data: 0
    # -- Windows Explorer --
    # Disable OneDerive access to network before login
    - path_wo_hklm: SOFTWARE\Microsoft\OneDrive
      name: PreventNetworkTrafficPreUserSignIn
      data: 1
    # Disable Microsoft OneDerive
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Windows\OneDrive
      name: DisableFileSyncNGSC
      data: 1
    # -- Search --
    # Disable extension of Windows search with Bing
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Windows\Explorer
      name: DisableSearchBoxSuggestions
      data: 1
    # -- Taskbar --
#    # Disable news and interests in the taskbar    TODO: Guarded by the  the UserChoice Protection Driver, cf., https://www.reddit.com/r/PowerShell/comments/1g8jdg6/works_in_ise_but_not_in_terminal_windows_11/
#    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Dsh
#      name: AllowNewsAndInterests
#      data: 0
    # -- Misc --
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Windows\DataCollection
      name: DoNotShowFeedbackNotifications
      data: 1
    # ----  OWN STUFF  ----
    # Edge -- Disable sharing Edge browsing data w/ Windows features
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: LocalBrowserDataShareEnabled
      data: 0
    # Edge -- Disable agentic browser control ("Browse with Copilot")
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: AllowBrowsingWithCopilot
      data: 0
    # Edge -- Disable Copilot new tab page       # TODO: Doesn't work
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: CopilotNewTabPageEnabled
      data: 0
    # Edge -- Disable "allow cowork to take actions on your behalf"
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: CopilotCoworkToolActionsEnabled
      data: 0
    # Edge -- Solid picture
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: NewTabPageAllowedBackgroundTypes
      data: 3
    # Edge -- Don't check default browser status
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: DefaultBrowserSettingEnabled
      data: 0
    # Edge -- Hide App Launcher from new tab page (MS 365 Apps)
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: NewTabPageAppLauncherEnabled
      data: 0
    # Edge -- Disable Bing trending suggestions in the address bar
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: AddressBarTrendingSuggestEnabled
      data: 0
    # Edge -- Disable Work Search suggestions in the address bar
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: AddressBarWorkSearchResultsEnabled
      data: 0
    # - Ege -- Extensions: ublock origin lite
    - path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
      name: ExtensionSettings
      type: string
      data: "{ \"cimighlppcgcoapaliogpjjdehbnofhn\": { \"installation_mode\": \"normal_installed\", \"update_url\": \"https://edge.microsoft.com/extensionwebstorebase/v1/crx\" }}"

    # TODO: Edge:
    # - Edge -- Replace Bing w/ Google     TODO: Doesn't work ?!!11
    #- path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
    #  name: DefaultSearchProvider
    #  type: string
    #  data: Google
    #- path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge
    #  name: DefaultSearchProviderSearchURL
    #  type: string
    #  data: "https://google.com{searchTerms}"
    #- path_wo_hklm: SOFTWARE\Policies\Microsoft\Edge

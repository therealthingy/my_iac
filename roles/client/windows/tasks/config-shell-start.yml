---
- name: List View
  block:
    - name: Local user
      ansible.windows.win_regedit:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Start
        name: AllAppsViewMode
        data: 2
        type: dword
    - name: Configure Default User Profile template 4 global enforcement
      block:
        - name: Mount Default User Registry Hive
          ansible.windows.win_powershell:
            script: |
              reg load HKLM\DefUser C:\Users\Default\NTUSER.DAT
          changed_when: false
        - name: Apply setting
          ansible.windows.win_regedit:
            path: HKLM:\DefUser\Software\Microsoft\Windows\CurrentVersion\Start
            name: AllAppsViewMode
            data: 2
            type: dword
      always:
        - name: Unmount Default User Registry Hive
          ansible.windows.win_powershell:
            script: |
              [gc]::Collect()
              [gc]::WaitForPendingFinalizers()
              reg unload HKLM\DefUser
          changed_when: false

- name: Disable Start Menu Tips & Recommendations
  block:
    - name: Local user
      ansible.windows.win_regedit:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        name: Start_IrisRecommendations
        data: 0
        type: dword
    - name: Configure Default User Profile template 4 global enforcement
      block:
        - name: Mount Default User Registry Hive
          ansible.windows.win_powershell:
            script: |
              reg load HKLM\DefUser C:\Users\Default\NTUSER.DAT
          changed_when: false
        - name: Apply setting
          ansible.windows.win_regedit:
            path: HKLM:\DefUser\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
            name: Start_IrisRecommendations
            data: 0
            type: dword
      always:
        - name: Unmount Default User Registry Hive
          ansible.windows.win_powershell:
            script: |
              [gc]::Collect()
              [gc]::WaitForPendingFinalizers()
              reg unload HKLM\DefUser
          changed_when: false

- name: Default pinned apps
  block:
    - ansible.windows.win_file:
        path: C:\Users\Default\AppData\Local\Microsoft\Windows\Shell
        state: directory
    - ansible.windows.win_copy:
        src: files/LayoutModification.json
        dest: C:\Users\Default\AppData\Local\Microsoft\Windows\Shell\LayoutModification.json

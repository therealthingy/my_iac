---
# Node settings
- name: Set timezone
  ansible.windows.win_timezone:
    timezone: "{{ win_timezone }}"

- name: Set computer name
  ansible.windows.win_hostname:
    name: "{{ win_hostname }}"
  register: hostname_change
  when: win_hostname is defined
# TODO:
#- name: Reboot the machine if the name was changed
#  ansible.windows.win_reboot:
#  when:
#    - win_hostname is defined
#    - hostname_change.reboot_required

# Power settings     TODO: Not idempotent
- name: Disable hibernation
  ansible.windows.win_powershell:
    script: |
      powercfg -h off
  when: ansible_facts['virtualization_role'] == 'guest'

- name: Disable display timeout
  ansible.windows.win_powershell:
    script: |
      powercfg -change -monitor-timeout-ac 0
      powercfg -change -monitor-timeout-dc 0
  when: ansible_facts['virtualization_role'] == 'guest'

- name: Disable sleep
  ansible.windows.win_powershell:
    script: |
      powercfg -change standby-timeout-ac 0
      powercfg /change standby-timeout-dc 0
  when: ansible_facts['virtualization_role'] == 'guest'

# TODO: Disk timeout (`powercfg /change disk-timeout-ac 0` & `powercfg /change disk-timeout-dc 0`)

# Activation
- name: WPA
  block:
    - name: 'WPA: Get product details'
      ansible.windows.win_product_facts:
    - name: Install generic key
      ansible.windows.win_shell: cscript.exe //NoLogo C:\Windows\System32\slmgr.vbs /ipk {{ win_pa_key }}
      when: ansible_facts["os_product_key"] != win_pa_key
    - name: 'WPA: Set KMS server'
      ansible.windows.win_shell: cscript.exe //NoLogo C:\Windows\System32\slmgr.vbs /skms {{ win_pa_kms_server }}
      when:
        - win_pa_kms_server is defined
        - ansible_facts["os_license_status"] != "Licensed"
    - name: 'WPA: Trigger WPA'
      ansible.windows.win_shell: cscript.exe //NoLogo C:\Windows\System32\slmgr.vbs /ato
      when:
        - win_pa_kms_server is defined
        - ansible_facts["os_license_status"] != "Licensed"
  when: win_pa_key is defined or win_pa_kms_server is defined

# Personalization
- name: Windows Lock Screen
  block:
  - name: Windows Lock Screen - Disable
    ansible.windows.win_regedit:
      path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization
      name: NoLockScreen
      data: 1
      type: dword
      state: present
  - name: Windows Lock Screen - Disable Slideshows
    ansible.windows.win_regedit:
      path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization
      name: NoLockScreenSlideshow
      data: 1
      type: dword
      state: present

- name: Windows Shell TaskBar - Start menu alignment
  block:
    - name: Windows Shell - Set Start Menu alignment to Left
      ansible.windows.win_regedit:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        name: TaskbarAl
        data: 0  # 0 = Left-aligned, 1 = Center-aligned
        type: dword
        state: present
    - name: Configure Default User Profile template 4 global enforcement
      block:
        - name: Mount Default User Registry Hive
          ansible.windows.win_powershell:
            script: |
              reg load HKLM\DefUser C:\Users\Default\NTUSER.DAT
          changed_when: false
        - name: Apply setting
          ansible.windows.win_regedit:
            path: HKLM:\DefUser\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
            name: TaskbarAl
            data: 0
            type: dword
            state: present
      always:
        - name: Unmount Default User Registry Hive
          ansible.windows.win_powershell:
            script: |
              [gc]::Collect()
              [gc]::WaitForPendingFinalizers()
              reg unload HKLM\DefUser
          changed_when: false

- name: Windows Shell TaskBar - Disable search box
  block:
    - name: Hide search box
      ansible.windows.win_regedit:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Search
        name: SearchboxTaskbarMode
        data: 0
        type: dword
        state: present
    - name: Configure Default User Profile template 4 global enforcement
      block:
        - name: Mount Default User Registry Hive
          ansible.windows.win_powershell:
            script: |
              reg load HKLM\DefUser C:\Users\Default\NTUSER.DAT
          changed_when: false
        - name: Apply setting
          ansible.windows.win_regedit:
            path: HKLM:\DefUser\Software\Microsoft\Windows\CurrentVersion\Search
            name: SearchboxTaskbarMode
            data: 0
            type: dword
            state: present
      always:
        - name: Unmount Default User Registry Hive
          ansible.windows.win_powershell:
            script: |
              [gc]::Collect()
              [gc]::WaitForPendingFinalizers()
              reg unload HKLM\DefUser
          changed_when: false

# M$ stuff
- name: M$ Account
  block:
    - name: M$ Account - Block users from adding or logging in
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name: NoConnectedUser   # NOTE: Works only in Education/Enterprise edition
        data: 3
        type: dword
        state: present
    - name: M$ Account - Disable M$ Account Sign-in Assistant service
      ansible.windows.win_service:
        name: wlidsvc
        start_mode: disabled
        state: stopped

- name: M$ Store
  block:
    - name: M$ Store - Turn off
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsStore
        name: RemoveWindowsStore   # NOTE: Works only in Education/Enterprise edition
        data: 1
        type: dword
        state: present
    - name: M$ Store - Block from offering or updating apps
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsStore
        name: DisableStoreApps
        data: 1
        type: dword
        state: present
    - name: M$ Store - Turn off automatic download & install of updates
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsStore
        name: AutoDownload
        data: 2  # 2 explicitly disables automatic updates
        type: dword
        state: present

- name: Disable Advertising/Tailored Experiences
  block:
    - name: Disable Advertising ID
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\AdvertisingInfo
        name: DisabledByGroupPolicy
        data: 1
        type: dword
        state: present
    - name: M$ Consumer Experiences - Disable
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent
        name: DisableWindowsConsumerFeatures
        data: 1
        type: dword
        state: present
    - name: Tailored Experiences - Disable
      ansible.windows.win_regedit:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Privacy
        name: TailoredExperiencesWithDiagnosticDataEnabled
        data: 0
        type: dword
        state: present
    - name: Tailored Experiences - Disable
      block:
        - name: Tailored Experiences - Mount Default User Registry Hive
          ansible.windows.win_powershell:
            script: |
              reg load HKLM\DefUser C:\Users\Default\NTUSER.DAT
          changed_when: false
        - name: Configure Default User Profile template 4 global enforcement
          block:
            - name: Tailored Experiences - Apply setting
              ansible.windows.win_regedit:
                path: HKLM:\DefUser\Software\Microsoft\Windows\CurrentVersion\Privacy
                name: TailoredExperiencesWithDiagnosticDataEnabled
                data: 0
                type: dword
                state: present
          always:
            - name: Tailored Experiences - Unmount Default User Registry Hive
              ansible.windows.win_powershell:
                script: |
                  [gc]::Collect()
                  [gc]::WaitForPendingFinalizers()
                  reg unload HKLM\DefUser
              changed_when: false

- name: Windows Spotlight
  block:
    - name: Windows Spotlight - Disable all features
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent
        name: DisableWindowsSpotlightFeatures
        data: 1
        type: dword
        state: present
    - name: Windows Spotlight - Turn off Spotlight collection on Desktop
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent
        name: ConfigureWindowsSpotlight
        data: 2
        type: dword
        state: present
    - name: Windows Spotlight - Force a single static wallpaper image (to prevent user-driven slideshows)
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\PersonalizationCSP
        name: DesktopImagePath
        data: 'C:\Windows\Web\Wallpaper\Windows\img0.jpg'
        type: string
        state: present

- name: Widgets
  block:
    #- name: Widgets - Turn off    TODO: Guarded by the  the UserChoice Protection Driver, cf., https://www.reddit.com/r/PowerShell/comments/1g8jdg6/works_in_ise_but_not_in_terminal_windows_11/
    #  ansible.windows.win_regedit:
    #    path: HKLM:\SOFTWARE\Policies\Microsoft\Dsh
    #    name: AllowNewsAndInterests
    #    data: 0
    #    type: dword
    #    state: present
    - name: Widgets - Turn off Widgets on the Windows Lock Screen
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Dsh
        name: DisableWidgetsOnLockScreen
        data: 1
        type: dword
        state: present

- name: Copilot stuff
  block:
    - name: Copilot - Turn off
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsCopilot
        name: TurnOffWindowsCopilot
        data: 1
        type: dword
        state: present
    - name: Copilot - Remove Copilot access from the Windows taskbar
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer
        name: DisableCopilot
        data: 1
        type: dword
        state: present
    - name: Copilot - Disable Windows AI Data Analysis (Windows Recall engine)
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsAI
        name: DisableAIDataAnalysis
        data: 1
        type: dword
        state: present
    - name: Copilot - Explicitly block Windows Recall snapshot enablement
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsAI
        name: AllowRecallEnablement
        data: 0
        type: dword
        state: present

- name: OneDrive
  block:
    - name: OneDrive - Prevent its usage for file storage
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\OneDrive
        name: DisableFileSyncNGSC
        data: 1
        type: dword
        state: present
    - name: OneDrive - Remove icon from File Explorer navigation pane
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\OneDrive
        name: DisableFileSync
        data: 1
        type: dword
        state: present
    - name: OneDrive - Block network traffic before user sign-in
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\OneDrive
        name: PreventNetworkTrafficPreUserSignIn
        data: 1
        type: dword
        state: present

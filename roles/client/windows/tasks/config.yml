---
# Node settings
- name: Set timezone
  ansible.windows.win_timezone:
    timezone: "{{ win_timezone }}"

- name: Set computer name
  ansible.windows.win_hostname:
    name: "{{ win_hostname }}"
  register: hostname_change
  when: win_hostname is defined
# TODO:
#- name: Reboot the machine if the name was changed
#  ansible.windows.win_reboot:
#  when:
#    - win_hostname is defined
#    - hostname_change.reboot_required

# Power settings     TODO: Not idempotent
- name: Disable hibernation
  ansible.windows.win_powershell:
    script: |
      powercfg -h off
  when: ansible_facts['virtualization_role'] == 'guest'

- name: Disable display timeout
  ansible.windows.win_powershell:
    script: |
      powercfg -change -monitor-timeout-ac 0
      powercfg -change -monitor-timeout-dc 0
  when: ansible_facts['virtualization_role'] == 'guest'

- name: Disable sleep
  ansible.windows.win_powershell:
    script: |
      powercfg -change standby-timeout-ac 0
      powercfg /change standby-timeout-dc 0
  when: ansible_facts['virtualization_role'] == 'guest'

# TODO: Disk timeout (`powercfg /change disk-timeout-ac 0` & `powercfg /change disk-timeout-dc 0`)

# Activation
- name: WPA
  block:
    - name: 'WPA: Get product details'
      ansible.windows.win_product_facts:
    - name: Install generic key
      ansible.windows.win_shell: cscript.exe //NoLogo C:\Windows\System32\slmgr.vbs /ipk {{ win_pa_key }}
      when: ansible_facts["os_product_key"] != win_pa_key
    - name: 'WPA: Set KMS server'
      ansible.windows.win_shell: cscript.exe //NoLogo C:\Windows\System32\slmgr.vbs /skms {{ win_pa_kms_server }}
      when:
        - win_pa_kms_server is defined
        - ansible_facts["os_license_status"] != "Licensed"
    - name: 'WPA: Trigger WPA'
      ansible.windows.win_shell: cscript.exe //NoLogo C:\Windows\System32\slmgr.vbs /ato
      when:
        - win_pa_kms_server is defined
        - ansible_facts["os_license_status"] != "Licensed"
  when: win_pa_key is defined or win_pa_kms_server is defined

# Personalization
- name: Windows Lock Screen
  block:
  - name: Windows Lock Screen - Disable
    ansible.windows.win_regedit:
      path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization
      name: NoLockScreen
      data: 1
      type: dword
      state: present
  - name: Windows Lock Screen - Disable Slideshows
    ansible.windows.win_regedit:
      path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization
      name: NoLockScreenSlideshow
      data: 1
      type: dword
      state: present

- name: Disable Windows startup sound
  block:
    - ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Authentication\LogonUI\BootAnimation
        name: DisableStartupSound
        data: 1
        type: dword
    - ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\EditionOverrides
        name: UserSetting_DisableStartupSound
        data: 1
        type: dword

- name: Windows Shell TaskBar - Start menu alignment
  block:
    - name: Local user
      ansible.windows.win_regedit:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        name: TaskbarAl
        data: 0  # 0 = Left-aligned, 1 = Center-aligned
        type: dword
        state: present
    - name: Configure Default User Profile template 4 global enforcement
      block:
        - name: Mount Default User Registry Hive
          ansible.windows.win_powershell:
            script: |
              reg load HKLM\DefUser C:\Users\Default\NTUSER.DAT
          changed_when: false
        - name: Apply setting
          ansible.windows.win_regedit:
            path: HKLM:\DefUser\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
            name: TaskbarAl
            data: 0
            type: dword
            state: present
      always:
        - name: Unmount Default User Registry Hive
          ansible.windows.win_powershell:
            script: |
              [gc]::Collect()
              [gc]::WaitForPendingFinalizers()
              reg unload HKLM\DefUser
          changed_when: false

- name: Windows Shell TaskBar - Disable search box
  block:

---
- name: Windows Lock Screen
  block:
  - name: Windows Lock Screen - Disable
    ansible.windows.win_regedit:
      path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization
      name: NoLockScreen
      data: 1
      type: dword
      state: present
  - name: Windows Lock Screen - Disable Slideshows
    ansible.windows.win_regedit:
      path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization
      name: NoLockScreenSlideshow
      data: 1
      type: dword
      state: present

- name: Lock Screen - Turn off lock screen background on the sign-in screen (configure solid color)
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\System
    name: DisableLogonBackgroundImage
    data: 1
    type: dword
    state: present

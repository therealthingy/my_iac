- name: Set solid color wallpaper
  block:
    - name: Disable intune restrictions
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\PersonalizationCSP
        name: DesktopImagePath
        #data: 'C:\Windows\Web\Wallpaper\Windows\img0.jpg'
        type: string
        state: absent
    - name: Turn off standard wallpaper image policy globally
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\System
        name: Wallpaper
        #data: ""
        type: string
        state: absent
    #
    - name: Current user
      block:
        - name: Clear current wallpaper
          ansible.windows.win_regedit:
            path: HKCU:\Control Panel\Desktop
            name: WallPaper
            data: ""
            type: string
        - name: Set solid colors
          ansible.windows.win_regedit:
            path: "{{ item }}"
            name: Background
            data: "0 120 215"  # 240 240 240 = Light Gray, 0 0 0 = Black, 0 120 215 = Windows Blue
            type: string
          loop:
            - HKCU:\Control Panel\Colors
            - HKCU:\Control Panel\Desktop
    - name: Configure Default User Profile template 4 global enforcement
      block:
        - name: Mount Default User Registry Hive
          ansible.windows.win_powershell:
            script: |
              reg load HKLM\DefUser C:\Users\Default\NTUSER.DAT
          changed_when: false
        - name: Apply setting - Clear current wallpaper
          ansible.windows.win_regedit:
            path: HKLM:\DefUser\Control Panel\Desktop
            name: WallPaper
            data: ""
            type: string
        - name: Set solid colors
          ansible.windows.win_regedit:
            path: "{{ item }}"
            name: Background
            data: "0 120 215"  # 240 240 240 = Light Gray, 0 0 0 = Black, 0 120 215 = Windows Blue
            type: string
          loop:
            - HKLM:\DefUser\Control Panel\Colors
            - HKLM:\DefUser\Control Panel\Desktop
      always:
        - name: Unmount Default User Registry Hive
          ansible.windows.win_powershell:
            script: |
              [gc]::Collect()
              [gc]::WaitForPendingFinalizers()
              reg unload HKLM\DefUser
          changed_when: false

---
win_timezone: W. Europe Standard Time

win_host_owner: "ansible"

storage_sense_configure: true
storage_sense:
  user_content_cleanup: true
  user_content_cleanup_days: 30
  delete_unused_files: true
  user_content_cleanup_trash_enabled: false
  user_content_cleanup_trash_days: 30
  user_content_cleanup_dls_enabled: false
  user_content_cleanup_dls_days: 30

choco_packages:
  # Inet
  - firefox
  # Devel
  - git.install
  - python3
  - winmerge
  - hxd
  # Office
  - imageglass
  - sumatrapdf.install
  - caesium.install
  - pdftkbuilder
  - vlc.install
  # PowerUser
  - 7zip.install
  - bleachbit.install
  - hashtab
  - vscodium.install
  - notepadplusplus.install
  - WinDirStat
  - powertoys
  # TODO: Windows 4 ARM (e.g., `Procmon64a` instead of `Procmon64`)
  - name: sysinternals
    state: present
    startmenu:
      folder: 'SysInternals'
      base_path: 'C:\ProgramData\chocolatey\lib\sysinternals\tools'
      package_exes:
        - AccessEnum
        - ADExplorer64
        - ADInsight64
        - Autoruns64
        - Bginfo64
        - Cacheset64
        - CoreinfoEx64
        - CPUSTRES64
        - dbgview64
        - Desktops64
        - disk2vhd64
        - Diskmon64
        - DiskView64
        - LoadOrd64
        - procexp64
        - Procmon64
        - RAMMap64
        - RDCMan
        - ShellRunas
        - tcpview64
        - vmmap64
        - Winobj64
        - ZoomIt64
  # Maintenance
  - bulk-crap-uninstaller   # TODO: Doesn't work
  - name: shutup10
    startmenu:
      base_path: 'C:\ProgramData\chocolatey\lib\shutup10\tools'
      package_exes: [OOSU10]

choco_packages_no_vm:
  # Inet
  - thunderbird
  # Office
  - InkScape
  - file-converter
  - drawio
  - obs-studio.install
  - libreoffice-fresh
  - digikam
  # HW Monitoring Tools
  - crystaldiskinfo # crystaldiskinfo.portable
  - crystaldiskmark
  - coretemp
  - cpu-z.install
  - gpu-z
  # Services/Misc. packages
  - wireguard
  - greenshot
  - rustdesk.install
  - keepassx
  - kindle
  #- lghub

remote_desktop_enabled: False

# SEE: https://github.com/stkrzysiak/windows-playbook-scoop/blob/master/default.config.yml
# Check: PowerShell -> `Get-AppxPackage`
remove_bloatware: True
bloatware:
